</svg><div class="plan-scale"><span>0</span><span>1</span><span>2 м</span></div></div>`}function nav(){document.getElementById('nav').innerHTML=stages.map((s,i)=>`<button class="${i===step?'active':''}" onclick="go(${i})"><b>${i+1}</b>${s}</button>`).join('');document.getElementById('topTitle').textContent=stages[step]}function go(n){if(step===2)saveBrief();step=n;render();window.scrollTo(0,0)}function next(){go(Math.min(6,step+1))}function saveBrief(){for(const k in data){const e=document.getElementById(k);if(e)data[k]=e.value}}function input(k,label,tag='input'){return `<label class="field ${k==='needs'||k==='limits'?'wide':''}">${label}${tag==='textarea'?`<textarea id="${k}">${data[k]}</textarea>`:`<input id="${k}" value="${data[k]}">`}</label>`}function render(){nav();let h='';if(step===0)h=`<div class="view"><div class="eyebrow">Предпродажная концепция</div><h1 class="heading">Новый проект</h1><p class="lead">От плана квартиры до понятных вариантов планировки для первой встречи. Начните с демо-квартиры или загрузите план клиента.</p><div class="grid"><section class="card"><span class="tag">Демо-проект</span><h2>${data.name}</h2><p class="muted">Семья с ребёнком · 82 м² · современный спокойный интерьер</p><div class="metricrow"><div class="metric"><strong>82 м²</strong><span>общая площадь</span></div><div class="metric"><strong>3</strong><span>сценария</span></div><div class="metric"><strong>2</strong><span>спальни</span></div></div><div class="actions"><button class="btn" onclick="go(1)">Начать с этого проекта</button></div></section><section class="card"><span class="tag">Как это работает</span><h2>План. Бриф. Решение.</h2><p class="muted">Помощник собирает исходные данные и предлагает варианты. Менеджер проверяет ограничения и выбирает, что показать клиенту.</p><div class="notice">Это демонстрационный прототип. Схемы условные и требуют проверки дизайнером и техническим специалистом.</div></section></div></div>`;if(step===1)h=`<div class="view"><div class="eyebrow">Шаг 01 / исходные данные</div><h1 class="heading">План квартиры</h1><p class="lead">Загрузите план БТИ или план от застройщика. Для знакомства с прототипом можно продолжить с демо-планом.</p><div class="grid"><section class="card"><label class="upload" for="file"><div class="icon">↥</div><strong id="filename">${uploaded||'Выберите файл или перетащите сюда'}</strong><p>PDF, JPG или PNG · до 20 МБ</p><input id="file" type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/*" onchange="fileChanged(this)"></label><div class="notice" id="filenote">${uploaded?'Файл добавлен. В этой демоверсии сценарии строятся на демонстрационной геометрии квартиры 82 м².':'Для демо уже подготовлен пример плана квартиры 82 м².'}</div><div class="actions"><button class="btn" onclick="next()">Продолжить с планом</button><button class="btn secondary" onclick="go(0)">Назад</button></div></section><section class="card"><h2>Исходный план · демо</h2><div class="planbox">${plan('base')}</div></section></div></div>`;if(step===2)h=`<div class="view"><div class="eyebrow">Шаг 02 / потребности</div><h1 class="heading">Короткий бриф</h1><p class="lead">Достаточно главных вводных. Их можно изменить перед показом клиенту.</p><section class="card"><div class="fields">${input('name','Название проекта')}${input('area','Площадь, м²')}${input('family','Состав семьи')}${input('style','Предпочитаемый стиль')}${input('needs','Помещения и задачи','textarea')}${input('budget','Бюджет на ремонт')}${input('limits','Что менять нельзя','textarea')}</div><div class="actions"><button class="btn" onclick="next()">Посмотреть анализ</button><button class="btn secondary" onclick="go(1)">Назад</button></div></section></div>`;if(step===3)h=`<div class="view"><div class="eyebrow">Шаг 03 / разбор плана</div><h1 class="heading">Что есть в квартире</h1><p class="lead">Предварительная разметка демо-плана. Перед реальным предложением менеджер подтверждает размеры и ограничения с дизайнером.</p><div class="analysis"><div class="card"><div class="planbox">${plan('base')}</div><p class="muted" style="font-size:13px">Условная схема: расположение и размеры показаны для демонстрации интерфейса.</p></div><div class="card"><h2>Обнаруженные элементы</h2><div class="checks"><div class="check"><b>01</b><div><strong>Контур и перегородки</strong><small>6 функциональных зон; несущие стены не изменяем.</small></div></div><div class="check"><b>02</b><div><strong>Окна и вход</strong><small>3 окна по двум фасадам; вход справа от холла.</small></div></div><div class="check"><b>03</b><div><strong>Мокрые зоны</strong><small>Кухня и санузел сохраняют существующее положение.</small></div></div><div class="check"><b>04</b><div><strong>Размеры</strong><small>82 м² по брифу; размеры комнат ориентировочные.</small></div></div></div><div class="actions"><button class="btn" onclick="next()">Смотреть сценарии</button><button class="btn secondary" onclick="go(2)">Изменить бриф</button></div></div></div></div>`;if(step===4)h=`<div class="view"><div class="eyebrow">Шаг 04 / выбор решения</div><h1 class="heading">Три сценария планировки</h1><p class="lead">Каждый вариант отвечает на свой приоритет. Выберите тот, который лучше подходит клиенту.</p><div class="scenarios">${Object.entries(scenarios).map(([k,s],i)=>`<article class="card scenario ${selected===k?'selected':''}" onclick="selectScenario('${k}')"><div class="thumb">${plan(k)}</div><div class="body"><span class="tag">Вариант 0${i+1}</span><h2>${s.name}</h2><p><b>${s.idea}.</b> ${s.text}</p><ul>${s.plus.map(x=>`<li>${x}</li>`).join('')}</ul><button class="btn ${selected===k?'':'secondary'}" onclick="event.stopPropagation();selectScenario('${k}')">${selected===k?'Выбран':'Выбрать вариант'}</button></div></article>`).join('')}</div><div class="actions"><button class="btn" onclick="next()">Открыть мини-концепцию</button><button class="btn secondary" onclick="go(3)">Назад</button></div><div class="notice">Варианты иллюстрируют разные приоритеты. Планировочные решения предварительные и не заменяют проектную документацию.</div></div>`;if(step===5)h=`<div class="view"><div class="eyebrow">Шаг 05 / образ интерьера</div><h1 class="heading">Мини-концепция</h1><p class="lead">${scenarios[selected].name}: ${scenarios[selected].idea.toLowerCase()}. Мягкие материалы и тёплые оттенки поддерживают спокойный характер квартиры.</p><div class="grid"><section class="card"><span class="tag">Палитра</span><h2>Молочный, песочный, шоколадный</h2><div class="palette" style="margin-bottom:36px"><div class="swatch" style="background:#eee8df"><span>Молочный</span></div><div class="swatch" style="background:#cbb9a7"><span>Песочный</span></div><div class="swatch" style="background:#8d6f5b"><span>Орех</span></div><div class="swatch" style="background:#4b352b"><span>Шоколад</span></div></div><h2>Материалы</h2><p class="muted">Натуральный дуб, матовый камень, фактурная штукатурка и плотный текстиль. Латунные детали — дозированно.</p><div class="notice">Концепция — отправная точка для обсуждения, а не спецификация материалов.</div></section><section class="card"><span class="tag">Выбранный сценарий</span><h2>${scenarios[selected].name}</h2><div class="planbox">${plan(selected)}</div><p class="muted">${scenarios[selected].text}</p></section></div><h2 style="font-family:Prata,serif;font-weight:400;margin:35px 0 16px">Визуальные ориентиры</h2><div class="refs"><div class="ref" style="background-image:url('https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?w=900&q=85')"><span>Светлая общая зона</span></div><div class="ref" style="background-image:url('https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?w=900&q=85')"><span>Натуральные фактуры</span></div><div class="ref" style="background-image:url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=900&q=85')"><span>Спокойная спальня</span></div></div><div class="actions"><button class="btn" onclick="next()">Открыть страницу клиента</button><button class="btn secondary" onclick="go(4)">К сценариям</button></div></div>`;if(step===6)h=`<div class="view"><div class="eyebrow">Готово / презентация для клиента</div><h1 class="heading">Ваш будущий дом</h1><p class="lead">Экран для показа на встрече. Здесь акцент на возможностях квартиры и выбранном решении.</p><div class="client"><div class="clienthero"><div><div class="eyebrow" style="color:#c7a990">Траст ремонт · концепция для обсуждения</div><h1>${data.name}</h1><p>Продуманная планировка для семьи, которая ценит пространство, удобство и спокойную эстетику.</p><div class="metricrow"><div class="metric" style="background:#59443a"><strong>${data.area} м²</strong><span style="color:#d7c8bd">площадь</span></div><div class="metric" style="background:#59443a"><strong>3</strong><span style="color:#d7c8bd">комнаты</span></div><div class="metric" style="background:#59443a"><strong>1</strong><span style="color:#d7c8bd">общая идея</span></div></div></div><div class="planbox">${plan(selected)}</div></div><div class="clientbody"><div class="eyebrow">Планировка</div><h2 style="font:400 32px Prata,serif">${scenarios[selected].name}</h2><p class="muted">${scenarios[selected].text}</p><div class="checks" style="grid-template-columns:repeat(3,1fr);margin:22px 0 32px">${scenarios[selected].plus.map(x=>`<div class="check"><b>✓</b><strong>${x}</strong></div>`).join('')}</div><div class="eyebrow">Настроение интерьера</div><h2 style="font:400 27px Prata,serif">Тёплая сдержанность</h2><p class="muted">Молочные стены, дерево тёплого тона, матовый камень и фактурный текстиль.</p><div class="refs"><div class="ref" style="background-image:url('https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?w=900&q=85')"></div><div class="ref" style="background-image:url('https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?w=900&q=85')"></div><div class="ref" style="background-image:url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=900&q=85')"></div></div><div class="cost-panel"><div><strong>Ориентир по работам</strong><small>35–40 тыс. ₽/м² · по площади ${data.area} м². Материалы и комплектация рассчитываются отдельно.</small></div><div class="cost-number">${(Number(data.area||82)*35000/1e6).toFixed(2).replace('.',',')}–${(Number(data.area||82)*40000/1e6).toFixed(2).replace('.',',')} млн ₽<span>предварительно, до сметы</span></div></div><p class="muted" style="font-size:13px;margin-top:20px">Предварительная концепция. Планировка, размеры и стоимость уточняются в полноценном дизайн-проекте.</p></div><div class="clientfooter"><div><strong style="font:400 24px Prata,serif">Сделаем следующий шаг?</strong><p style="margin:7px 0 0;color:#7b6759">Разработаем детальный проект под ваш образ жизни и бюджет.</p></div><button class="btn" onclick="cta()">Перейти к полноценному дизайн-проекту</button></div></div><div class="actions"><button class="btn secondary" onclick="go(4)">Изменить вариант</button><button class="btn ghost" onclick="window.print()">Печать / PDF</button></div></div>`;document.getElementById('app').innerHTML=h}function selectScenario(k){selected=k;render()}function fileChanged(el){const f=el.files[0];if(!f)return;if(f.size>20*1024*1024){alert('Файл больше 20 МБ. Выберите файл меньшего размера.');el.value='';return}uploaded=f.name;document.getElementById('filename').textContent=f.name;document.getElementById('filenote').textContent='Файл добавлен. В этой демоверсии сценарии строятся на демонстрационной геометрии квартиры 82 м².'}function cta(){alert('Следующий шаг: менеджер согласует консультацию и подготовку полноценного дизайн-проекта.')}render();
</script></body></html>
