name: Manual editor checks
on:
  workflow_dispatch:
  push:
    branches: [claude/festive-turing-m7na3z]
    paths:
      - 'app/src/**'
      - 'app/tests/**'
      - 'app/e2e/**'
      - 'app/package*.json'
      - 'app/vite.config.ts'
      - 'app/index.html'
      - '.github/workflows/editor-check.yml'
permissions:
  contents: read
jobs:
  desktop-editor:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npx vitest run --exclude tests/bench.test.ts --maxWorkers=2 --testTimeout=30000
      - run: npm run build
      - name: Desktop editing and persistence through the actual UI
        run: npx playwright test e2e/editor-shortcuts.spec.ts e2e/manual-dimensions.spec.ts e2e/flow.spec.ts e2e/scene.spec.ts e2e/editor-interactions.spec.ts e2e/security.spec.ts --project=desktop --reporter=line --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: manual-editor-failure
          path: app/test-results
