name: Windows application
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'config/**'
      - '.github/workflows/windows-desktop.yml'
permissions:
  contents: read
jobs:
  editor-checks:
    uses: ./.github/workflows/editor-check.yml
  windows-app:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npx vitest run --exclude tests/bench.test.ts --maxWorkers=2 --testTimeout=30000
      - name: Build the Windows installer
        run: npm run desktop:package
      - name: Build an unpublished installer for the real upgrade test
        run: npm run desktop:fixture
      - name: Test the packaged EXE, PDF, backup and project persistence
        run: npm run desktop:test
      - name: Installer checksums
        shell: pwsh
        run: Get-FileHash release/TrustRemontPlanner-Setup-*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TrustRemontPlanner-Windows
          path: |
            app/release/TrustRemontPlanner-Setup-*.exe
            app/release/TrustRemontPlanner-Setup-*.exe.blockmap
            app/release/latest.yml
            app/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-app-check
          path: app/test-results
          if-no-files-found: ignore
  publish-update:
    needs: [windows-app, editor-checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: TrustRemontPlanner-Windows
          path: release
      - name: Publish the tested version for in-app updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node app/desktop/publish-release.cjs release

